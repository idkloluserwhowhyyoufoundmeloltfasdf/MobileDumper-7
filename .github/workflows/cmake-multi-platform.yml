name: Android build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build Android arm64 library
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          chmod +x build.sh
          ./build.sh --platform android --target lib --build release --arch arm64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release
          path: builds/android/lib/release/arm64/libMobileDumper-7.so
